services:
  facade:
    image: facade
    build:
      context: .
      dockerfile: Dockerfile
      target: facade
      args:
        PYTHON_TAG: ${PYTHON_TAG:-latest}
    environment:
      FACADE_LOGGING_INSTANCES: '["logging-1", "logging-2", "logging-3"]'
    ports:
      - 80
    depends_on:
      - logging-1
      - logging-2
      - logging-3
      - counter
    develop:
      watch:
        - path: services/facade
          action: rebuild

  logging-1: &logging-service
    image: logging
    build:
      context: .
      dockerfile: Dockerfile
      target: logging
      args:
        PYTHON_TAG: ${PYTHON_TAG:-latest}
    environment:
      LOGGING_HAZELCAST_CLUSTER: ${HAZELCAST_CLUSTER_NAME}
    develop:
      watch:
        - path: services/logsvc
          action: rebuild
    depends_on:
      - hazelcast
    # Deploy performs worse
    # deploy:
    #   replicas: 3
    #   endpoint_mode: dnsrr
    #   restart_policy:
    #     condition: on-failure

  logging-2: *logging-service
  logging-3: *logging-service

  counter:
    image: counter
    build:
      context: .
      dockerfile: Dockerfile
      target: counter
      args:
        PYTHON_TAG: ${PYTHON_TAG:-latest}
    environment:
      COUNTER_MONGODB_CONNECTION_STRING: "mongodb://${MONGODB_COUNTER_USER}:${MONGODB_COUNTER_PASSWORD}@mongodb"
    develop:
      watch:
        - path: services/countersvc
          action: rebuild

  hazelcast:
    image: hazelcast/hazelcast:5.4.0
    ports:
      - 5701
    environment:
      HZ_CLUSTERNAME: ${HAZELCAST_CLUSTER_NAME}
      # HZ_CPSUBSYSTEM_CPMEMBERCOUNT: 3
      # HZ_CPSUBSYSTEM_SESSIONHEARTBEATINTERVALSECONDS: 3
      # HZ_CPSUBSYSTEM_SESSIONTIMETOLIVESECONDS: 10
    deploy:
      replicas: 3
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure

  mongodb:
    image: mongo:8.2.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - mongo-db:/data/db

volumes:
  mongo-db:
