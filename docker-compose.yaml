services:
  facade:
    image: facade
    build:
      context: .
      dockerfile: Dockerfile
      target: facade
      args:
        PYTHON_TAG: ${PYTHON_TAG:-latest}
    environment:
      FACADE_CONSUL_HOST: "consul"
    ports:
      - 80
    depends_on:
      logging:
        condition: service_started
      counter:
        condition: service_started
      consul:
        condition: service_healthy
        restart: true
    develop:
      watch:
        - path: services/facade
          action: rebuild

  logging:
    image: logging
    build:
      context: .
      dockerfile: Dockerfile
      target: logging
      args:
        PYTHON_TAG: ${PYTHON_TAG:-latest}
    environment:
      LOGGING_CONSUL_HOST: "consul"
    depends_on:
      hazelcast:
        condition: service_started
      consul:
        condition: service_healthy
        restart: true
    develop:
      watch:
        - path: services/logsvc
          action: rebuild
    deploy:
      replicas: 3
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure

  counter:
    image: counter
    build:
      context: .
      dockerfile: Dockerfile
      target: counter
      args:
        PYTHON_TAG: ${PYTHON_TAG:-latest}
    environment:
      COUNTER_MONGODB_CONNECTION_STRING: "mongodb://${MONGODB_COUNTER_USER}:${MONGODB_COUNTER_PASSWORD}@mongodb"
      COUNTER_CONSUL_HOST: "consul"
    depends_on:
      hazelcast:
        condition: service_started
      consul:
        condition: service_healthy
        restart: true
      mongodb:
        condition: service_started
    develop:
      watch:
        - path: services/countersvc
          action: rebuild

  hazelcast:
    image: hazelcast/hazelcast:5.4.0
    ports:
      - 127.0.0.1:0:5701
    environment:
      HZ_CLUSTERNAME: ${HAZELCAST_CLUSTER_NAME}
      # HZ_CPSUBSYSTEM_CPMEMBERCOUNT: 3
      # HZ_CPSUBSYSTEM_SESSIONHEARTBEATINTERVALSECONDS: 3
      # HZ_CPSUBSYSTEM_SESSIONTIMETOLIVESECONDS: 10
    deploy:
      replicas: 3
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure

  mongodb:
    image: mongo:8.2.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - mongo-db:/data/db

  consul:
    image: hashicorp/consul
    ports:
      - 127.0.0.1:8500:8500
    healthcheck:
      test: ["CMD", "consul", "info", "-http-addr=127.0.0.1:8500"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3s
    restart: unless-stopped
    volumes:
      - ./consul-init.sh:/consul-init.sh
    command:
      ["/consul-init.sh", "consul", "agent", "-dev", "-client", "0.0.0.0"]
    environment:
      HAZELCAST_CLUSTER_NAME: ${HAZELCAST_CLUSTER_NAME:?}
      HAZELCAST_CLUSTER_MEMBERS: '["hazelcast"]'
      COUNTER_HAZELCAST_QUEUE_NAME: ${COUNTER_HAZELCAST_QUEUE_NAME:?}

volumes:
  mongo-db:
