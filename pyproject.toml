[project]
name = "microservices"
version = "0.1.0"
description = ""
authors = [{ name = "timofey282228", email = "tymopod-ipt25@lll.kpi.ua" }]
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = []

[dependency-groups]
dev = [
    "pylint (>=4.0.5,<5.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
]
test = ["pytest (>=9.0.2,<10.0.0)", "pytest-asyncio (>=1.3.0,<2.0.0)"]

[tool.uv.workspace]
members = ["services/*"]

[tool.uv.sources]
config-server-client = { path = "packages/config-server-client" }

[tool.isort]
profile = "black"

[tool.pylint]
disable = [
    "format", # use black
]
