[project]
name = "countersvc"
version = "0.1.0"
description = ""
authors = [{ name = "timofey282228", email = "tymopod-ipt25@lll.kpi.ua" }]
dependencies = [
    "fastapi (>=0.135.0,<0.136.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "black (>=26.1.0,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.10.7,<0.11.0"]

[tool.isort]
profile = "black"

[tool.pylint]
disable = [
    "format", # use black
]
